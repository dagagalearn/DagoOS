<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Center · DagoOS</title>
  <meta name="description" content="Personal life hub" />

  <!-- CSS load order matters: tokens → reset → layout → components (later) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <!-- Favicon (inline SVG, no file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%236366f1'/></svg>" />
</head>

<body data-page="dashboard">

  <div class="app">

    <!-- ============================================================
         SIDEBAR — brand + navigation
         ============================================================ -->
    <aside class="sidebar">

      <div class="sidebar__brand">
        <span class="sidebar__brand-dot"></span>
        <span>DagoOS</span>
      </div>

      <nav class="sidebar__section">
        <div class="sidebar__label">Overview</div>

        <a class="nav-link nav-link--active" href="index.html">
          <!-- icon: grid / dashboard -->
          <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Command Center</span>
        </a>
      </nav>

      <nav class="sidebar__section">
        <div class="sidebar__label">Modules</div>

        <a class="nav-link" href="ledger.html">
          <!-- icon: wallet / card -->
          <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="6" width="20" height="14" rx="2"/>
            <path d="M2 10h20"/>
          </svg>
          <span>Dago Ledger</span>
        </a>

        <a class="nav-link" href="journal.html">
          <!-- icon: book -->
          <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4v16a2 2 0 0 0 2 2h14V4H6a2 2 0 0 0-2 2z"/>
            <path d="M8 8h8M8 12h8M8 16h5"/>
          </svg>
          <span>Dago Journal</span>
        </a>

        <a class="nav-link" href="academy.html">
          <!-- icon: graduation cap -->
          <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 9l10-5 10 5-10 5z"/>
            <path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>
          </svg>
          <span>Dago Academy</span>
        </a>

        <a class="nav-link" href="vault.html">
          <!-- icon: folder / lock -->
          <svg class="nav-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <span>Dago Vault</span>
        </a>
      </nav>

    </aside>

    <!-- ============================================================
         HEADER — page title + future actions
         ============================================================ -->
    <header class="header">
      <div class="header__title">Command Center</div>
      <div class="header__actions">
        <!-- Auth UI (sign-in button OR user chip) is injected here by main.js -->
        <div id="auth-area" class="auth-area"></div>
      </div>
    </header>

    <!-- ============================================================
         MAIN — page content
         ============================================================ -->
    <main class="main">

      <div class="page-header">
        <h1 class="page-header__title">Welcome back.</h1>
        <p class="page-header__subtitle">
          Shell is live. Modules and data come next.
        </p>
      </div>

      <!-- Future: summary cards, quick scratchpad, recent activity -->

    </main>

  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
